
name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # WinForms (net8.0-windows) requires a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ByteTide.sln

      - name: Build
        run: dotnet build ByteTide.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ByteTide.Tests/ByteTide.Tests.csproj --configuration Release --no-restore --verbosity normal

